plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nez.tiltwin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nez.tiltwin'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
